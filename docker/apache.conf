<VirtualHost *:*>
    DocumentRoot /var/www/html
    ServerName localhost

    # Variáveis da Railway disponíveis para o PHP
    PassEnv STORAGE_DIR ADMIN_USUARIO ADMIN_SENHA UPLOAD_MAX_MB

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Arquivos internos nunca são servidos
    RedirectMatch 404 ^/(inc|storage|docker|\.git|\.github)(/|$)
    RedirectMatch 404 (router\.php|Dockerfile|\.md|\.json|\.sh|\.gitignore|\.dockerignore)$

    # Imagens enviadas pelo painel ficam no Volume
    Alias /uploads ${STORAGE_DIR}/uploads
    <Directory ${STORAGE_DIR}/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
        php_admin_flag engine off
        Header set X-Content-Type-Options nosniff
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </Directory>

    <Directory /var/www/html/assets>
        ExpiresActive On
        ExpiresDefault "access plus 1 hour"
    </Directory>

    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
